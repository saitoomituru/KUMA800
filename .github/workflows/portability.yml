name: Hosted portability probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hosted-portability:
    name: ${{ matrix.os }} / Python 3.12
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: uvとPython 3.12を準備
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12"
          enable-cache: true
          cache-suffix: ${{ runner.os }}

      - name: lockどおりに同期
        run: uv sync --frozen --all-groups

      - name: hosted portability test
        run: uv run --frozen pytest -m "not live and not physical"
